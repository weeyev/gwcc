name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r backend/requirements-dev.lock -e backend
      - run: npm ci
      - run: npm run check
      - run: python -m ruff check backend
      - run: python -m ruff format --check backend
      - run: python -m pytest backend/tests -q
      - run: python -m geocast.cli train --region all --source sample
